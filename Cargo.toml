[package]
name = "fireworks"
version = "0.1.0"
edition = "2021"

[dependencies]
foldhash = "0.2"
glam = "0.30"
pixels = "0.17"
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
web-time = "1"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true

[profile.dev]
opt-level = 2
